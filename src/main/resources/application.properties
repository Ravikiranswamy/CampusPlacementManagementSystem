
spring.application.name=campusplacement

# ── Neon PostgreSQL Connection ────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=neondb_owner
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# ddl-auto=none means we manage tables via SQL scripts — do NOT change this
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Jackson (JSON serialisation) ──────────────────────────────────────────────
# Timestamps as ISO-8601 strings, not epoch numbers
spring.jackson.serialization.write-dates-as-timestamps=false
# Skip null fields in responses (keeps JSON clean)
spring.jackson.default-property-inclusion=non_null

# ── Validation ────────────────────────────────────────────────────────────────
spring.mvc.throw-exception-if-no-handler-found=true

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.placement.campusplacement=DEBUG
logging.level.org.hibernate.SQL=DEBUG
